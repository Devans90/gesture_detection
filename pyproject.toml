[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-detection"
version = "0.1.0"
description = "Scaffolding for a Raspberry Pi ultrasonic gesture detection project"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Devans90" }]
dependencies = []

[project.scripts]
gesture-detect = "gesture_detection.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
